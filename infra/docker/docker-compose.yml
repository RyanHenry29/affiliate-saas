version: "3.9"
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: affiliate_saas
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?required}"]
    ports: ["6379:6379"]
    volumes: ["redisdata:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Gateway de mensagens: módulo isolado e substituível.
  # NÃO acoplar lógica de negócio diretamente a esta instância.
  evolution-api:
    image: atendai/evolution-api:latest
    depends_on: [redis, postgres]
    ports: ["8080:8080"]
    env_file: .env.evolution
    volumes: ["evolution_instances:/evolution/instances"]

volumes:
  pgdata:
  redisdata:
  evolution_instances:
