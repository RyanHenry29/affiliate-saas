# Render config for the affiliate-saas API + Worker (NestJS monorepo).
# Provisiona um Redis (usado pelo BullMQ) e os serviços web + worker.
# O banco Postgres é externo (Supabase) — preencha DATABASE_URL manualmente.

redis:
  - name: affiliate-saas-redis
    plan: free
    ipAllowList: []

services:
  - type: web
    name: affiliate-saas-api
    runtime: node
    plan: free
    rootDir: .
    buildCommand: >-
      pnpm install --prod=false &&
      pnpm --filter @affiliate-saas/contracts build &&
      pnpm --filter @affiliate-saas/shared-types build &&
      pnpm --filter @affiliate-saas/api exec prisma generate &&
      pnpm --filter @affiliate-saas/api build
    preDeployCommand: >-
      pnpm --filter @affiliate-saas/api exec prisma migrate deploy &&
      pnpm --filter @affiliate-saas/api exec prisma seed
    startCommand: cd apps/api && node dist/main.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: EVOLUTION_API_URL
        sync: false
      - key: EVOLUTION_API_KEY
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: affiliate-saas-redis
          property: connectionString

  - type: worker
    name: affiliate-saas-worker
    runtime: node
    plan: free
    rootDir: .
    buildCommand: >-
      pnpm install --prod=false &&
      pnpm --filter @affiliate-saas/contracts build &&
      pnpm --filter @affiliate-saas/shared-types build &&
      pnpm --filter @affiliate-saas/worker exec prisma generate &&
      pnpm --filter @affiliate-saas/worker build
    startCommand: cd apps/worker && node dist/main.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: affiliate-saas-redis
          property: connectionString
      - key: ENCRYPTION_KEY
        sync: false
      - key: EVOLUTION_API_URL
        sync: false
      - key: EVOLUTION_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: llama-3.3-70b-versatile
